name: Test VSCode Extension

on:
  push:
    branches-ignore:
      - main
    paths:
      - "plugins/tabula.vscode/**"
      - ".github/workflows/vscode-plugin.yml"
  pull_request:
    branches-ignore:
      - main
    paths:
      - "plugins/tabula.vscode/**"
      - ".github/workflows/vscode-plugin.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: plugins/tabula.vscode/package-lock.json

      - name: Cache VSCode Test
        uses: actions/cache@v3
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('plugins/tabula.vscode/package-lock.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Install dependencies
        working-directory: plugins/tabula.vscode
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.vscode
        run: npm run lint

      - name: Run tests
        working-directory: plugins/tabula.vscode
        run: xvfb-run -a npm test

      - name: Build extension
        working-directory: plugins/tabula.vscode
        run: npm run build

      - name: Upload test logs on failure
        if: failure()
        run: |
          LOG_DIR="plugins/tabula.vscode/.vscode-test/user-data/logs/"
          if [ -d "$LOG_DIR" ]; then
            echo "Uploading test logs..."
            gh-actions-upload-artifact --name test-logs --path "$LOG_DIR" --retention-days 7
          else
            echo "No test logs found to upload."
          fi
