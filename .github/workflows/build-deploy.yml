name: Build + Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  NODE_VERSION: 20.x
  GO_VERSION: "1.22.x"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------
  # Tabula Go
  # --------------------
  tabula_go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-
      - name: Inject version into Go source
        run: |
          VERSION=$(cat VERSION.txt)
          cat <<EOF > cmd/cli/version.go
          package main

          const VERSION = "$VERSION"
          EOF
      - name: Install dependencies
        run: go mod download
      - name: Run vet
        run: make vet
      - name: Run tests
        run: make test
      - name: Build Go binary
        run: make build
      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: tabula_go_bin
          path: bin/

  # --------------------
  # Tabula Obsidian Plugin
  # --------------------
  tabula_obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json
      - name: Build and test Obsidian plugin
        working-directory: plugins/tabula.obsidian
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm test
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_obsidian
          path: plugins/tabula.obsidian/out/

  # --------------------
  # Tabula VSCode Plugin
  # --------------------
  tabula_vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.vscode/package-lock.json
      - name: Build and test VSCode plugin
        working-directory: plugins/tabula.vscode
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_vscode
          path: plugins/tabula.vscode/out/

  # --------------------
  # Vim Plugin
  # --------------------
  tabula_vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV
      - name: Package Vim plugin
        run: |
          mkdir -p dist
          tar -czf dist/tabula.vim-$VERSION.tar.gz -C plugins/tabula.vim doc ftdetect plugin syntax README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_vim
          path: dist/

