name: Test Obsidian Plugin

on:
  push:
    branches-ignore:
      - main
    paths:
      - "plugins/tabula.obsidian/**"
      - ".github/workflows/obsidian-plugin.yml"
  pull_request:
    branches-ignore:
      - main
    paths:
      - "plugins/tabula.obsidian/**"
      - ".github/workflows/obsidian-plugin.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: plugins/tabula.obsidian/node_modules
          key: obsidian-node-modules-${{ runner.os }}-${{ hashFiles('plugins/tabula.obsidian/package-lock.json') }}
          restore-keys: |
            obsidian-node-modules-${{ runner.os }}-

      - name: Install dependencies
        working-directory: plugins/tabula.obsidian
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.obsidian
        run: npm run lint

      - name: Compile extension
        working-directory: plugins/tabula.obsidian
        run: npm run build

      - name: Run tests
        working-directory: plugins/tabula.obsidian
        run: npm run test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-test-logs
          path: plugins/tabula.obsidian/.vscode-test/user-data/logs/
          retention-days: 7
