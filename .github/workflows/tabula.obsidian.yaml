name: Build Tabula.vscode

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 20.x

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tabula_obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json
      - name: Build and test Obsidian plugin
        working-directory: plugins/tabula.obsidian
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm test
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_obsidian
          path: plugins/tabula.obsidian/out/
