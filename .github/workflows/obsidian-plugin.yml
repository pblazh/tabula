name: Test VSCode Extension

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json

      - name: Install dependencies
        working-directory: plugins/tabula.obsidian
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.obsidian
        run: npm run lint

      - name: Compile extension
        working-directory: plugins/tabula.obsidian
        run: npm run build

      - name: Run tests
        working-directory: plugins/tabula.obsidian
        run: npm run test
