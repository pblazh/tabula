name: Build Tabula.vscode

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 20.x

jobs:
  tabula_vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.vscode/package-lock.json
      - name: Build and test VSCode plugin
        working-directory: plugins/tabula.vscode
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_vscode
          path: plugins/tabula.vscode/out/
