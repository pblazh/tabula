name: CI Build + Test Plugins + Semantic Release + GitHub Pages + Releases

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: 20.x
  GO_VERSION: "1.24.2"

# -------------------------------
# Test Jobs (parallel, produce artifacts)
# -------------------------------
jobs:
  tabula_go:
    name: Test Go
    runs-on: ubuntu-latest
    outputs:
      go_bin_dir: ${{ steps.upload.outputs.go_bin_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-

      - name: Install dependencies
        run: go mod download

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build Executable
        run: make build

      - name: Upload Go binary
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: go-bin
          path: ./bin
        run: echo "go_bin_dir=./bin" >> $GITHUB_OUTPUT

  tabula_obsidian:
    name: Test Obsidian plugin
    runs-on: ubuntu-latest
    outputs:
      obsidian_artifact: ${{ steps.upload.outputs.obsidian_artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: plugins/tabula.obsidian/node_modules
          key: obsidian-node-modules-${{ runner.os }}-${{ hashFiles('plugins/tabula.obsidian/package-lock.json') }}
          restore-keys: |
            obsidian-node-modules-${{ runner.os }}-

      - name: Install dependencies
        working-directory: plugins/tabula.obsidian
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.obsidian
        run: npm run lint

      - name: Compile extension
        working-directory: plugins/tabula.obsidian
        run: npm run build

      - name: Run tests
        working-directory: plugins/tabula.obsidian
        run: npm run test

      - name: Pack and Upload Obsidian Plugin
        id: upload
        run: |
          VERSION="dev"
          mkdir -p dist
          tar -czf dist/tabula.obsidian-$VERSION.tar.gz -C plugins/tabula.obsidian out
          echo "obsidian_artifact=dist/tabula.obsidian-$VERSION.tar.gz" >> $GITHUB_OUTPUT
        uses: actions/upload-artifact@v4
        with:
          name: tabula-obsidian
          path: dist/tabula.obsidian-$VERSION.tar.gz

  tabula_vscode:
    name: Test VSCode plugin
    runs-on: ubuntu-latest
    outputs:
      vscode_artifact: ${{ steps.upload.outputs.vscode_artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: plugins/tabula.vscode/package-lock.json

      - name: Cache VSCode Test
        uses: actions/cache@v3
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('plugins/tabula.vscode/package-lock.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Install dependencies
        working-directory: plugins/tabula.vscode
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.vscode
        run: npm run lint

      - name: Run tests
        working-directory: plugins/tabula.vscode
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test

      - name: Pack and Upload VSCode Plugin
        id: upload
        run: |
          VERSION="dev"
          mkdir -p dist
          tar -czf dist/tabula.vscode-$VERSION.tar.gz -C plugins/tabula.vscode out
          echo "vscode_artifact=dist/tabula.vscode-$VERSION.tar.gz" >> $GITHUB_OUTPUT
        uses: actions/upload-artifact@v4
        with:
          name: tabula-vscode
          path: dist/tabula.vscode-$VERSION.tar.gz

  tabula_vim:
    name: Test Vim plugin
    runs-on: ubuntu-latest
    outputs:
      vim_artifact: ${{ steps.upload.outputs.vim_artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Pack and Upload Vim Plugin
        id: upload
        run: |
          VERSION="dev"
          mkdir -p dist
          tar -czf dist/tabula.vim-$VERSION.tar.gz -C plugins/tabula.vim doc ftdetect plugin syntax README.md
          echo "vim_artifact=dist/tabula.vim-$VERSION.tar.gz" >> $GITHUB_OUTPUT
        uses: actions/upload-artifact@v4
        with:
          name: tabula-vim
          path: dist/tabula.vim-$VERSION.tar.gz

  # -------------------------------
  # Release/Build/Deploy (only main)
  # -------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [tabula_go, tabula_obsidian, tabula_vscode, tabula_vim]
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install semantic-release globally
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Determine next version & generate changelog
        id: get_version
        run: |
          VERSION=$(semantic-release --branches main --dry-run | grep "Next release version" | awk '{print $NF}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          semantic-release --branches main --dry-run --ci false --plugins @semantic-release/changelog
          git add CHANGELOG.md

      - name: Commit CHANGELOG and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): $VERSION [skip ci]" || echo "No changes to commit"
          git tag "v$VERSION"
          git push origin main --tags

  deploy:
    runs-on: ubuntu-latest
    needs: [tabula_go, tabula_obsidian, tabula_vscode, tabula_vim, release]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          names: go-bin, tabula-obsidian, tabula-vscode, tabula-vim

      - name: Prepare gh-pages content
        run: |
          VERSION=${{ needs.release.outputs.version }}
          mkdir -p gh-pages/bin
          mkdir -p gh-pages/releases

          cp -r artifacts/go-bin/* gh-pages/bin/
          cp artifacts/tabula-obsidian/*.tar.gz gh-pages/releases/
          cp artifacts/tabula-vscode/*.tar.gz gh-pages/releases/
          cp artifacts/tabula-vim/*.tar.gz gh-pages/releases/

          cd gh-pages/releases
          ln -sf tabula.obsidian-*.tar.gz tabula.obsidian-latest.tar.gz
          ln -sf tabula.vscode-*.tar.gz tabula.vscode-latest.tar.gz
          ln -sf tabula.vim-*.tar.gz tabula.vim-latest.tar.gz
          cd ../..

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          force_orphan: true
