version: "2"
linters:
  enable:
    - errcheck
    - govet
    - errname
    - gocritic
    - godoclint
    - godox
    - ineffassign
    - makezero
    - modernize
    - nolintlint
    - reassign
    - recvcheck
    - unused
    - wrapcheck
    - thelper
    - nestif
    # - ireturn
    # - unparam
    # - nilnil
    # - iface
    # - gosec
    # - gocognit
    # - exhaustruct
    # - err113
    # - cyclop
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - golines
run:
  timeout: 5m
