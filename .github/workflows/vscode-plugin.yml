name: Test VSCode Extension

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: plugins/tabula.vscode/package-lock.json

      - name: Install dependencies
        working-directory: plugins/tabula.vscode
        run: npm ci

      - name: Run linter
        working-directory: plugins/tabula.vscode
        run: npm run lint

      - name: Compile extension
        working-directory: plugins/tabula.vscode
        run: npm run compile

      - name: Run tests
        working-directory: plugins/tabula.vscode
        run: xvfb-run -a npm test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: plugins/tabula.vscode/.vscode-test/user-data/logs/
          retention-days: 7
