name: Build Tabula.obsidian

on:
  push:
    branches-ignore:
      - main
    paths:
      - ".github/workflows/tabula.obsidian.yaml"
      - "plugins/tabula.obsidian/**"
  workflow_dispatch:

env:
  NODE_VERSION: 20.x

jobs:
  tabula_obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json
      - uses: extractions/setup-just@v3

      - name: Install dependencies
        run: just setup-obsidian

      - name: Lint
        run: just lint-obsidian

      - name: Test
        run: just test-obsidian

      - name: Build
        run: just build-obsidian

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_obsidian
          path: plugins/tabula.obsidian/out/
