name: Build + Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 24.x
  GO_VERSION: "1.22.x"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: write
  id-token: write

jobs:
  # --------------------
  # Tabula Go
  # --------------------
  tabula_go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: use golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

      - name: Build tabula go
        run: just go

      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: tabula_go_bin
          path: bin/

  # --------------------
  # Tabula VSCode Plugin
  # --------------------
  tabula_vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.vscode/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Install dependencies
        run: just vscode-setup

      - name: Lint
        run: just vscode-lint

      - name: Run tests with xvfb
        working-directory: plugins/tabula.vscode
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test

      - name: Build
        run: just vscode-build

      - name: Pack
        run: just vscode-pack

      - name: Read version
        run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_vscode
          path: plugins/tabula.vscode/dist/tabula-${{ env.VERSION }}.vsix

  # --------------------
  # Vim Plugin
  # --------------------
  tabula_vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: Pack
        run: just vim

      - name: Read version
        run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabula_vim
          path: plugins/tabula.vim/dist/tabula.vim.${{ env.VERSION }}.tar.gz

  # --------------------
  # Check if version is not deployed yet
  # --------------------
  version_check:
    runs-on: ubuntu-latest
    needs: [tabula_go, tabula_vscode, tabula_vim]
    outputs:
      skip_deploy: ${{ steps.check.outputs.skip_deploy }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

      - name: Read version and check tag
        id: check
        run: |
          git fetch --tags

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag exists, skipping deployment"
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist, will deploy"
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Create git tag
        if: steps.check.outputs.skip_deploy == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

  # --------------------
  # Create GitHub Release with compiled binaries
  # --------------------
  create_release:
    needs: [version_check, tabula_go, tabula_vim, tabula_vscode]
    if: needs.version_check.outputs.skip_deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: tabula_go_bin
          path: bin/

      - name: Download Vim plugin
        uses: actions/download-artifact@v4
        with:
          name: tabula_vim

      - name: Download VSCode plugin
        uses: actions/download-artifact@v4
        with:
          name: tabula_vscode

      - name: Create release archive
        run: |
          cp -r bin/ tabula/
          tar -czf tabula-${{ needs.version_check.outputs.version }}.tar.gz tabula/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version_check.outputs.version }}
          name: v${{ needs.version_check.outputs.version }}
          files: |
            tabula-${{ needs.version_check.outputs.version }}.tar.gz
            tabula.vim.${{ needs.version_check.outputs.version }}.tar.gz
            tabula-${{ needs.version_check.outputs.version }}.vsix

  # --------------------
  # Deploy Tabula GitHub pages
  # --------------------
  deploy_pages:
    needs: [version_check, tabula_go, tabula_vscode, tabula_vim]
    if: needs.version_check.outputs.skip_deploy == 'false'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      contents: write
      id-token: write

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

      - name: Prepare gh-pages directory
        run: |
          mkdir -p gh-pages/releases
          sed -i "s/\[VERSION\]/${VERSION}/g" gh-pages/index.html

      - name: Download tabula_go_bin
        uses: actions/download-artifact@v4
        with:
          name: tabula_go_bin
          path: gh-pages/releases

      - name: Download tabula_vscode
        uses: actions/download-artifact@v4
        with:
          name: tabula_vscode
          path: gh-pages/releases

      - name: Download tabula_vim
        uses: actions/download-artifact@v4
        with:
          name: tabula_vim
          path: gh-pages/releases

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          force_orphan: true
