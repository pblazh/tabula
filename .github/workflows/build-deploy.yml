name: CI + Build + Release

on:
  push:
    branches:
      - main
      - "release/v*.*.*" # any release branch from Makefile
  workflow_dispatch: {} # allow manual trigger

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: 20.x
  GO_VERSION: "1.24.2"

jobs:
  # --------------------
  # Run all tests in parallel
  # --------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tabula_go, tabula_obsidian, tabula_vscode]
    steps:
      - uses: actions/checkout@v4

      # Go tests
      - name: Setup Go
        if: matrix.service == 'tabula_go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        if: matrix.service == 'tabula_go'
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-

      - name: Run Go tests
        if: matrix.service == 'tabula_go'
        run: |
          set -euo pipefail
          go mod download
          make test

      # Obsidian plugin tests
      - name: Setup Node.js
        if: matrix.service == 'tabula_obsidian'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.obsidian/package-lock.json

      - name: Cache Obsidian node_modules
        if: matrix.service == 'tabula_obsidian'
        uses: actions/cache@v3
        with:
          path: plugins/tabula.obsidian/node_modules
          key: obsidian-node-modules-${{ runner.os }}-${{ hashFiles('plugins/tabula.obsidian/package-lock.json') }}
          restore-keys: |
            obsidian-node-modules-${{ runner.os }}-

      - name: Run Obsidian plugin tests
        if: matrix.service == 'tabula_obsidian'
        run: |
          set -euo pipefail
          cd plugins/tabula.obsidian
          npm ci
          npm run lint
          npm run build
          npm run test
        working-directory: plugins/tabula.obsidian

      # VSCode plugin tests
      - name: Setup Node.js for VSCode
        if: matrix.service == 'tabula_vscode'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/tabula.vscode/package-lock.json

      - name: Cache VSCode node_modules
        if: matrix.service == 'tabula_vscode'
        uses: actions/cache@v3
        with:
          path: plugins/tabula.vscode/node_modules
          key: vscode-node-modules-${{ runner.os }}-${{ hashFiles('plugins/tabula.vscode/package-lock.json') }}
          restore-keys: |
            vscode-node-modules-${{ runner.os }}-

      - name: Run VSCode plugin tests
        if: matrix.service == 'tabula_vscode'
        run: |
          set -euo pipefail
          cd plugins/tabula.vscode
          npm ci
          npm run lint
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
          npm run build
        working-directory: plugins/tabula.vscode

  # --------------------
  # Build binaries and plugins
  # --------------------
  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get current version
        id: get_version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Go binaries
        run: make build -j

      - name: Package plugins
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          mkdir -p dist
          # Obsidian
          tar -czf dist/tabula.obsidian-$VERSION.tar.gz -C plugins/tabula.obsidian out
          # VSCode
          tar -czf dist/tabula.vscode-$VERSION.tar.gz -C plugins/tabula.vscode out
          # Vim
          tar -czf dist/tabula.vim-$VERSION.tar.gz -C plugins/tabula.vim doc ftdetect plugin syntax README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: dist/

  # --------------------
  # Release: semantic versioning + CHANGELOG + GitHub Release
  # --------------------
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install semantic-release globally
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        run: |
          set -euo pipefail
          semantic-release --branches main
